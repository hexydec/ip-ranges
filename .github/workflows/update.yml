name: Rebuild IP Ranges

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate-ips:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install bgpdump
        run: sudo apt-get update && sudo apt-get install -y bgpdump

      - run: php build.php

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate IP blocks
